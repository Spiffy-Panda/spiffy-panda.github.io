<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Atkinson Hyperlegible','Lexend','Segoe UI',system-ui,sans-serif" role="img" aria-label="Panda Papers Podcast set in three stacked lines with the panda emblem at the right, over a faint wireframe of the reader layout.">
  <defs>
    <linearGradient id="gs-wave" gradientUnits="userSpaceOnUse" x1="22" y1="41" x2="42" y2="27">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gs-type" gradientUnits="userSpaceOnUse" x1="70" y1="540" x2="740" y2="470">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="gs-glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.24"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <g id="gs-mark">
      <circle cx="19.5" cy="17.5" r="7.5" fill="#6366f1"/>
      <circle cx="44.5" cy="17.5" r="7.5" fill="#ec4899"/>
      <circle cx="32" cy="35" r="20" fill="#f3f4f6"/>
      <g stroke="url(#gs-wave)" stroke-width="4.2" stroke-linecap="round">
        <line x1="22" y1="37" x2="22" y2="31"/>
        <line x1="28.7" y1="41" x2="28.7" y2="27"/>
        <line x1="35.3" y1="39.5" x2="35.3" y2="28.5"/>
        <line x1="42" y1="36" x2="42" y2="32"/>
      </g>
    </g>
  </defs>

  <rect width="1280" height="720" fill="#0d1320"/>

  <!-- lo-fi wireframe of the player, sitting well behind the type -->
  <g stroke="#8894ab" stroke-width="3" fill="none" opacity="0.13">
    <line x1="72" y1="104" x2="1208" y2="104"/>
    <line x1="600" y1="140" x2="600" y2="552"/>
    <rect x="72" y="140" width="490" height="112" rx="10"/>
    <rect x="72" y="284" width="490" height="150" rx="10"/>
    <rect x="72" y="466" width="360" height="86" rx="10"/>
    <rect x="640" y="140" width="80" height="56" rx="10"/>
    <rect x="748" y="140" width="440" height="56" rx="10"/>
    <rect x="640" y="228" width="80" height="86" rx="10"/>
    <rect x="748" y="228" width="440" height="86" rx="10"/>
    <rect x="640" y="346" width="80" height="56" rx="10"/>
    <rect x="748" y="346" width="440" height="56" rx="10"/>
    <rect x="640" y="434" width="80" height="86" rx="10"/>
    <rect x="748" y="434" width="440" height="86" rx="10"/>
    <line x1="640" y1="634" x2="1000" y2="634"/>
    <circle cx="1080" cy="634" r="26"/>
    <rect x="72" y="614" width="70" height="40" rx="8"/>
    <rect x="158" y="614" width="70" height="40" rx="8"/>
    <rect x="244" y="614" width="70" height="40" rx="8"/>
  </g>
  <rect width="1280" height="720" fill="#0d1320" opacity="0.34"/>

  <ellipse cx="240" cy="340" rx="520" ry="440" fill="url(#gs-glowL)"/>
  <ellipse cx="1080" cy="330" rx="500" ry="420" fill="url(#gs-glowR)"/>

  <rect x="70" y="96" width="120" height="6" rx="3" fill="#ec4899"/>

  <text x="70" y="256" font-size="132" font-weight="800" fill="#f7f8fa">PANDA</text>
  <text x="70" y="392" font-size="132" font-weight="800" fill="#f7f8fa">PAPERS</text>
  <text x="70" y="528" font-size="132" font-weight="800" fill="url(#gs-type)">PODCAST</text>

  <text x="74" y="608" font-size="31" font-weight="700" fill="#9aa5b8" letter-spacing="2.4">PDF IN &#183; TWO VOICES OUT &#183; ALL LOCAL</text>

  <use href="#gs-mark" transform="translate(830,137) scale(6.25)"/>
</svg>
